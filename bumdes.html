 "Produk Tabungan dan Deposito":()=>`<h3>Produk Tabungan dan Deposito</h3><div class="card"><div class="k">Produk punya bunga sendiri (menggantikan bunga dasar dan tingkat) dan, bila jangka diisi, menjadi deposito: tidak bisa ditarik sebelum jatuh tempo dan tidak menerima setoran tambahan. Bunga dan jangka dikunci saat rekening dibuka.</div>${savProds().length?savProds().map(p=>`<div class="ph"><span><b>${esc(p.name)}</b> · ${String(p.rate).replace(".",",")}% per tahun · ${p.term>0?"jangka "+p.term+" bulan":"tanpa jangka"}</span><span class="pa">${ib("x","Hapus","delSavProd('"+p.id+"')","x")}</span></div>`).join(""):'<div class="k">Belum ada produk.</div>'}${fld("sv-pn","Nama produk baru",{value:""})}${fld("sv-pr","Bunga (% per tahun)",{a:' inputmode="decimal" autocomplete="off"',value:""})}${fld("sv-pt","Jangka (bulan, 0 = tanpa jangka)",{a:' inputmode="numeric" autocomplete="off"',value:"0"})}<button class="b s" onclick="addSavProd()">Tambah produk</button></div>`,

 "Tabungan Wajib Pencairan":()=>`<h3>Tabungan Wajib Pencairan</h3><div class="card"><div class="k">Bagian pinjaman yang dipotong sebagai tabungan wajib saat pencairan (diatur di Master Tarif &amp; Biaya) masuk ke rekening tabungan nasabah sendiri. Pilih perlakuannya. Berlaku untuk pencairan berikutnya; pinjaman lama tidak berubah.</div>${fld("sp-twpol","Perlakuan tabungan wajib",{t:"select",a:' onchange="setTwPolicy(this.value)"',opts:opt([["bebas","Bebas ditarik kapan saja"],["kunci","Terkunci sampai pinjaman lunas"],["kembali","Terkunci, lalu dikembalikan otomatis saat lunas"]],x=>x,twPol())})}</div>`,

 "Batas Pengajuan dan Transaksi":()=>`<h3>Batas Pengajuan dan Transaksi</h3><div class="card"><div class="k">Pengajuan di luar batas ditolak; pengajuan identik atau melewati batas per nasabah hanya diberi peringatan.</div>${Object.keys(SPL0).map(k=>fld("spl-"+k,SPL_L[k],{type:"text",a:' inputmode="numeric" autocomplete="off" onchange="setSpl(\''+k+'\',this.value)"',value:spl()[k]})).join("")}</div>`,
 "Nomor dan Denda":()=>`<h3>Nomor dan Denda</h3><div class="card">${(()=>{const pc=penCodes(),cur=penRate(today())?db.settings.penalty_code:"";return fld("sp-pencode","Sumber tarif denda",{t:"select",a:' onchange="setPenCode(this.value)"',opts:opt([["","Angka manual di bawah"],...pc.map(c=>[c,"Master Tarif & Biaya: "+c])],x=>x,cur)})+(cur?`<p class="k">Denda ${String(penPct(today())).replace(".",",")}% per hari dari angsuran menurut ${esc(cur)} (versi berlaku hari ini). Ubah angkanya di Master &gt; Tarif &amp; Biaya sebagai versi baru.</p>`:`<div class="fl"><button class="b s" onclick="pindahDenda()">Pindahkan denda ke Master Tarif &amp; Biaya</button></div>`)})()}<label>Denda keterlambatan manual (% per hari dari angsuran; 0 = nonaktif)</label><input type="number" step="any" inputmode="decimal" value="${db.settings.penalty_pct_day||0}"${penRate(today())?' disabled aria-disabled="true"':""} onchange="setPen(this.value)"><label>Format nomor pinjaman</label><input type="text" autocomplete="off" value="${esc(numFmt("loan"))}" onchange="setNum('loan',this.value)"><label>Format nomor draf</label><input type="text" autocomplete="off" value="${esc(numFmt("draft"))}" onchange="setNum('draft',this.value)"><label>Format nomor akad</label><input type="text" autocomplete="off" value="${esc(numFmt("akad"))}" onchange="setNum('akad',this.value)"><div class="k">Kode: {YYYY} tahun, {YY} dua digit tahun, {MM} bulan, {DD} tanggal, {NNNN} nomor urut otomatis (2–6 huruf N). Tanggal diambil dari tanggal pengajuan; nomor urut mulai 1 lagi saat tanggal/bulan/tahun pada format berganti. Contoh nomor berikutnya: <b>${esc(numNext("loan",today()))}</b></div><label>Jasa saat pelunasan dipercepat</label><select onchange="setPo(this.value)"><option value="current"${(db.settings.payoff_interest||"current")==="current"?" selected":""}>Sampai angsuran berjalan (sisa jasa tidak ditagih)</option><option value="full"${db.settings.payoff_interest==="full"?" selected":""}>Seluruh sisa jasa sesuai jadwal</option></select><label>Biaya pelunasan dipercepat (dari Tarif & Pajak)</label><select onchange="setPoFee(this.value)"><option value="">Tanpa biaya</option>${[...new Set(rateRows().filter(r=>r.fee_type==="pelunasan").map(r=>r.fee_code))].map(c=>`<option value="${esc(c)}"${db.settings.payoff_fee===c?" selected":""}>${esc(c)}</option>`).join("")}</select><div class="k">Pilihan berisi tarif berjenis Pelunasan dipercepat. Pajak (bila tarif dikenai pajak) ditambahkan di atas biaya dan masuk akun 2220.</div><label>Biaya yang dipotong saat pencairan</label>${(()=>{const cs=[...new Set(rateRows().filter(r=>DISB_TYPES.includes(r.fee_type)).map(r=>r.fee_code))];return cs.length?cs.map(c=>`<label class="chk"><input type="checkbox" onchange="setDisb('${esc(c)}',this.checked)"${disbCodes().includes(c)?" checked":""}> ${esc(c)}</label>`).join(""):'<div class="k">Belum ada tarif berjenis Administrasi, Provisi, Materai, Transfer, atau Biaya lain di Tarif & Pajak.</div>'})()}<div class="k">Bawaan: semua tarif biaya aktif di Tarif & Pajak otomatis dipotong; hilangkan centang untuk mengecualikan satu biaya. Jasa pinjaman baru juga bisa dipilih dari tarif Jasa di formulir pengajuan. Biaya dan pajak dipotong dari pinjaman: dana bersih yang diterima nasabah = pokok − biaya − pajak. Pokok tetap menjadi piutang penuh.</div></div>`,

function saveBd(){try{const v=k=>$("#bd-"+k).value.trim(),n=v("name");
 if(!n)throw fe("bd-name","Nama BUMDes wajib diisi");
 if(v("email")&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("email")))throw fe("bd-email","Format email tidak valid");
 if(v("phone")&&!/^[\d\s+()\-]{5,20}$/.test(v("phone")))throw fe("bd-phone","Telepon hanya boleh angka, spasi, +, -, ( )");
 const b=db.bumdes[0]||(db.bumdes[0]={_id:"BUMDES-001"});
 BF.forEach(([k])=>{b[k]=v(k)});b.updated_at=now();audit("update","bumdes",b._id);
 if(S.dr)BF.forEach(([k])=>delete S.dr["set|bd-"+k]);S.nsnap=1;save();S.msg="Profil BUMDes disimpan";if(typeof cloudRenameChk==="function")cloudRenameChk()}catch(e){S.msg="⚠ "+e.message;S.fe=e.f?{id:e.f,m:e.message}:null}render()}

function fl(i){const f=i.files[0];if(f)f.text().then(t=>{$("#bk").value=t})}
function chk(j){
 NEWK.forEach(k=>{if(j[k]===undefined)j[k]=[]});
 KEYS.forEach(k=>{if(!Array.isArray(j[k]))throw Error("Koleksi hilang: "+k)});
 const by={};j.journal_lines.forEach(l=>by[l.journal_entry_id]=(by[l.journal_entry_id]||0)+l.debit-l.credit);
 if(Object.values(by).some(x=>Math.abs(x)>.005))throw Error("Ada jurnal yang tidak balance");chkLoans(j)}
// SP0: konsistensi pinjaman pada backup (status vs jadwal vs pembayaran)
function chkLoans(j){const ins={},pay={};j.loan_installments.forEach(i=>(ins[i.loan_id]=ins[i.loan_id]||[]).push(i));j.loan_payments.forEach(p=>(pay[p.loan_id]=pay[p.loan_id]||[]).push(p));
 const ids=new Set(j.loans.map(l=>l._id));
 Object.keys(ins).forEach(k=>{if(!ids.has(k))throw Error("Angsuran mengacu ke pinjaman yang tidak ada ("+k+")")});Object.keys(pay).forEach(k=>{if(!ids.has(k))throw Error("Pembayaran mengacu ke pinjaman yang tidak ada ("+k+")")});
 j.loans.forEach(l=>{const w=m=>Error("Pinjaman "+(l.loan_number||l._id)+": "+m),is=ins[l._id]||[],ps=(pay[l._id]||[]).filter(p=>p.status!=="voided");
  if(!LS[l.status])throw w("status tidak dikenal ("+l.status+")");
  if(!(Number.isFinite(l.principal)&&l.principal>0))throw w("pokok tidak valid");if(!(Number.isInteger(l.tenor)&&l.tenor>=1))throw w("tenor tidak valid");
  if(!(Number.isFinite(l.interest_rate)&&l.interest_rate>=0))throw w("jasa tidak valid");if(!["flat","menurun","anuitas"].includes(l.interest_method))throw w("metode jasa tidak dikenal");if(l.calc!==undefined&&(typeof l.calc!=="object"||!l.calc||Array.isArray(l.calc)))throw w("parameter hitung (snapshot) rusak");
  if(!(j.parties||[]).some(x=>x._id===l.party_id))throw w("nasabah tidak ditemukan");
  if(["active","paid_off","written_off"].includes(l.status)){
   if(is.length!==l.tenor)throw w("jumlah angsuran ("+is.length+") tidak sama dengan tenor ("+l.tenor+")");
   if(is.reduce((a,i)=>a+i.principal_due,0)!==l.principal)throw w("jumlah pokok jadwal tidak sama dengan pokok pinjaman");
   if(is.some(i=>i.principal_paid>i.principal_due||i.principal_paid<0))throw w("pembayaran pokok melebihi jadwal");
   if(is.reduce((a,i)=>a+i.principal_paid,0)!==ps.reduce((a,p)=>a+p.principal_amount,0))throw w("pokok terbayar di jadwal tidak sama dengan jumlah pembayaran");
   const all=is.every(i=>i.status==="paid");if(l.status==="paid_off"&&!all)throw w("berstatus Lunas tetapi masih ada angsuran belum lunas");if(l.status==="active"&&all)throw w("berstatus Aktif tetapi semua angsuran sudah lunas");
   if(!l.disbursement_date)throw w("tanggal pencairan kosong")}
  else{if(is.length)throw w("berstatus "+LS[l.status]+" tetapi memiliki jadwal angsuran");if(ps.length)throw w("berstatus "+LS[l.status]+" tetapi memiliki pembayaran")}})}

 const nd=blank();nd.bumdes=o.bumdes&&o.bumdes.length?o.bumdes:nd.bumdes;["users","roles","permissions"].forEach(k=>{if(Array.isArray(o[k])&&o[k].length)nd[k]=o[k]});
